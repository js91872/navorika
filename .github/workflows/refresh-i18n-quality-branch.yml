name: Refresh i18n inventory on quality branch

on:
  push:
    branches:
      - feat/adsense-quality-standard-nov02
    paths:
      - .github/workflows/refresh-i18n-quality-branch.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adsense-quality-standard-nov02
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run i18n:audit:write
      - name: Commit inventory changes only
        run: |
          if git diff --quiet -- docs/i18n-coverage.json; then
            echo "Inventory already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/i18n-coverage.json
          git commit -m "chore: regenerate multilingual coverage inventory"
          git push origin HEAD:feat/adsense-quality-standard-nov02
