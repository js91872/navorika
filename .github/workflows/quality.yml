name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate architecture
        run: npm run validate:architecture

      - name: Check TypeScript
        run: npm run typecheck

      - name: Prevent new lint debt
        run: npm run lint:baseline

      - name: Verify multilingual routing, dictionaries and calculations
        run: npm run test:i18n

      - name: Build production application
        run: npm run build

      - name: Install Chromium for multilingual browser checks
        run: npx playwright install --with-deps chromium

      - name: Test translated production pages and tools
        run: npm run test:i18n:browser
