name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate architecture
        run: npm run validate:architecture

      - name: Check TypeScript
        run: npm run typecheck

      - name: Prevent new lint debt
        run: npm run lint:baseline

      - name: Verify committed multilingual inventory is current
        run: |
          npm run i18n:audit:write
          git diff -- docs/i18n-coverage.json
          git diff --exit-code -- docs/i18n-coverage.json

      - name: Audit full multilingual coverage and shared localization support
        run: npm run test:i18n:audit

      - name: Verify multilingual routing, dictionaries and calculations
        run: npm run test:i18n

      - name: Check deployment safety and rollback
        run: npm run test:deploy

      - name: Install fonts for Unicode PDF rendering tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-core
          fc-cache -f

      - name: Run complete unit test suite
        run: npm test

      - name: Check canonical URLs and processing disclosures
        run: node --import tsx --test scripts/seo-canonical-routing.test.mjs scripts/seo-trust-disclosures.test.mjs scripts/seo-related-tools.test.mjs scripts/seo-unix-time-accuracy.test.mjs scripts/seo-batch3-7-safeguards.test.mjs scripts/seo-image-quality.test.mjs scripts/adsense-final-editorial-safeguards.test.mjs

      - name: Build production application
        run: npm run build

      - name: Install Chromium for multilingual browser checks
        run: npx playwright install --with-deps chromium

      - name: Run staging smoke tests
        run: npm run test:smoke

      - name: Test translated production pages and tools
        run: npm run test:i18n:browser
