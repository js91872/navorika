<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="syncTitle syncDesc">
  <title id="syncTitle">iCloud Live Sync vs iCloud Device Backups</title>
  <desc id="syncDesc">Diagram contrasting live two-way synchronization services against static point-in-time device backup snapshots in Apple iCloud.</desc>
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="460" fill="#f8fafc" rx="16"/>

  <text x="50" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    The Fundamental Difference: Live Sync vs. Device Backup
  </text>
  <text x="50" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Understanding why deleting photos affects all devices, while deleting a backup touches none of them.
  </text>

  <!-- Left Container: Live Two-Way Sync -->
  <g filter="url(#shadow2)">
    <rect x="50" y="100" width="335" height="325" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="50" y="100" width="335" height="8" rx="4" fill="#3b82f6"/>
  <text x="75" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">
    1. Live Two-Way Sync
  </text>
  <text x="75" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#2563eb">
    iCloud Photos, Contacts, Notes, Drive
  </text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#475569">
    <rect x="70" y="180" width="295" height="60" rx="8" fill="#eff6ff"/>
    <text x="82" y="202" font-weight="700" fill="#1e40af">How it works:</text>
    <text x="82" y="222">A central master database in Apple's cloud mirrors changes continuously across iPhone, iPad, and Mac.</text>

    <text x="75" y="265" font-weight="700" fill="#0f172a">Deletion Consequence:</text>
    <text x="75" y="287" font-weight="600" fill="#dc2626">⚠ Deleting here deletes everywhere!</text>
    <text x="75" y="307">Deleting a photo from your iPhone also deletes it from your Mac, iPad, and iCloud.com.</text>

    <text x="75" y="345" font-weight="700" fill="#0f172a">Safe Cleanup Method:</text>
    <text x="75" y="367">Turn on &quot;Optimize iPhone Storage&quot; or copy full-resolution originals to an external hard drive before removing.</text>
  </g>

  <!-- Right Container: Point-in-Time Device Backup -->
  <g filter="url(#shadow2)">
    <rect x="415" y="100" width="335" height="325" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="415" y="100" width="335" height="8" rx="4" fill="#e5322d"/>
  <text x="440" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="800" fill="#991b1b">
    2. Point-in-Time Device Backup
  </text>
  <text x="440" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#e5322d">
    iPhone &amp; iPad System Snapshots
  </text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#475569">
    <rect x="435" y="180" width="295" height="60" rx="8" fill="#fff1f1"/>
    <text x="447" y="202" font-weight="700" fill="#991b1b">How it works:</text>
    <text x="447" y="222">A compressed archive of your settings, app layout, and device config captured once per night on Wi-Fi.</text>

    <text x="440" y="265" font-weight="700" fill="#0f172a">Deletion Consequence:</text>
    <text x="440" y="287" font-weight="600" fill="#16a34a">✓ Does NOT delete physical phone data!</text>
    <text x="440" y="307">All pictures, apps, and contacts stay safely on your iPhone. Only the recovery image is removed.</text>

    <text x="440" y="345" font-weight="700" fill="#0f172a">Safe Cleanup Method:</text>
    <text x="440" y="367">Delete old traded-in devices immediately. For current phone, create a free encrypted Mac/PC backup first.</text>
  </g>
</svg>
