<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">How to calculate square feet</title><desc id="desc">A floor plan with a 12 by 10 foot rectangle and a 5 by 4 foot extension, totaling 140 square feet.</desc><rect width="1200" height="630" fill="#fffaf9"/><rect x="52" y="54" width="1096" height="522" rx="30" fill="#fff" stroke="#f1d7d4" stroke-width="3"/><text x="105" y="136" fill="#202025" font-family="Arial,sans-serif" font-size="48" font-weight="700">How to calculate square feet</text><text x="106" y="182" fill="#666" font-family="Arial,sans-serif" font-size="25">Measure each section. Add the areas.</text><path d="M140 255 H580 V410 H765 V525 H140 Z" fill="#fff0ee" stroke="#e5322d" stroke-width="8" stroke-linejoin="round"/><path d="M580 410 V525" stroke="#e5322d" stroke-width="4" stroke-dasharray="12 10"/><text x="280" y="356" fill="#222" font-family="Arial,sans-serif" font-size="31" font-weight="700">12 × 10 ft</text><text x="620" y="476" fill="#222" font-family="Arial,sans-serif" font-size="25" font-weight="700">5 × 4 ft</text><text x="140" y="242" fill="#555" font-family="Arial,sans-serif" font-size="21">12 ft</text><text x="105" y="398" fill="#555" font-family="Arial,sans-serif" font-size="21">10 ft</text><rect x="820" y="258" width="275" height="214" rx="20" fill="#e5322d"/><text x="855" y="316" fill="white" font-family="Arial,sans-serif" font-size="24">Total floor area</text><text x="855" y="389" fill="white" font-family="Arial,sans-serif" font-size="60" font-weight="700">140</text><text x="855" y="428" fill="white" font-family="Arial,sans-serif" font-size="29">square feet</text><text x="823" y="514" fill="#555" font-family="Arial,sans-serif" font-size="20">120 + 20 = 140 sq ft</text></svg>