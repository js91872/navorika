<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">JPEG and JPG are the same file format</title><desc id="d">Side-by-side identical landscape photographs labeled JPEG and JPG with an equality sign</desc><rect width="1200" height="630" fill="#f7f7f4"/><rect x="74" y="110" width="462" height="385" rx="23" fill="#fff" stroke="#d8d8d3" stroke-width="5"/><rect x="664" y="110" width="462" height="385" rx="23" fill="#fff" stroke="#d8d8d3" stroke-width="5"/><defs><g id="land"><rect width="390" height="230" rx="12" fill="#dceef7"/><circle cx="297" cy="58" r="28" fill="#ffc877"/><path d="M0 194 L105 76 L197 173 L278 110 L390 205 V230 H0Z" fill="#779f96"/><path d="M0 211 L124 139 L224 230 H0Z" fill="#4f817c"/></g></defs><use href="#land" x="110" y="150"/><use href="#land" x="700" y="150"/><rect x="179" y="412" width="252" height="61" rx="14" fill="#e5322d"/><text x="305" y="452" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="31">.jpeg</text><rect x="769" y="412" width="252" height="61" rx="14" fill="#e5322d"/><text x="895" y="452" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="31">.jpg</text><circle cx="600" cy="299" r="61" fill="#fff" stroke="#e5322d" stroke-width="5"/><text x="600" y="321" text-anchor="middle" fill="#e5322d" font-family="Arial,sans-serif" font-weight="700" font-size="76">=</text><text x="600" y="572" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#30343a">Same format. Different extension.</text></svg>