<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">How to Clear iCloud Storage Safely: iPhone, Mac &amp; Photos Guide</title>
  <desc id="desc">Illustrated diagram showing iCloud storage breakdown bar, phone settings, cleanup steps, and safety checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5322d"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="180" fill="#fee2e2" opacity="0.4"/>
  <circle cx="120" cy="520" r="160" fill="#fee2e2" opacity="0.3"/>

  <!-- Category Badge -->
  <rect x="80" y="50" width="170" height="34" rx="17" fill="#fff1f1" stroke="#fecaca" stroke-width="1.5"/>
  <text x="165" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#e5322d" text-anchor="middle" letter-spacing="1">APPLE STORAGE GUIDE</text>

  <!-- Main Title & Subtitle -->
  <text x="80" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="44" font-weight="900" fill="#18181b" letter-spacing="-1">How to Clear iCloud Storage</text>
  <text x="80" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="500" fill="#5b5b63">Reclaim 5 GB to 50 GB+ Without Losing Photos or Essential Backups</text>

  <!-- Main Illustration Panel (Simulated Device & Storage Visual) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="210" width="1040" height="360" rx="20" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  </g>

  <!-- Storage Meter Header inside card -->
  <text x="120" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#18181b">iCloud Storage Allocation</text>
  <text x="960" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#e5322d" text-anchor="end">48.2 GB of 50 GB Used (96%)</text>

  <!-- Segmented Storage Bar -->
  <g>
    <!-- Background track -->
    <rect x="120" y="276" width="960" height="28" rx="8" fill="#e4e4e8"/>
    <!-- Photos: 28 GB (56% = 537px) -->
    <rect x="120" y="276" width="538" height="28" rx="8" fill="#e5322d"/>
    <!-- Backups: 10 GB (20% = 192px) -->
    <rect x="660" y="276" width="192" height="28" fill="#f97316"/>
    <!-- Messages: 6 GB (12% = 115px) -->
    <rect x="854" y="276" width="115" height="28" fill="#3b82f6"/>
    <!-- Drive & Docs: 4.2 GB (8.4% = 80px) -->
    <rect x="971" y="276" width="80" height="28" fill="#10b981"/>
    <!-- Free Space: 1.8 GB (3.6% = 35px) remaining grey -->
  </g>

  <!-- Legend -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#5b5b63">
    <!-- Photos -->
    <circle cx="128" cy="328" r="6" fill="#e5322d"/>
    <text x="142" y="332">Photos &amp; 4K Videos (28.0 GB)</text>

    <!-- Backups -->
    <circle cx="390" cy="328" r="6" fill="#f97316"/>
    <text x="404" y="332">Device Backups (10.0 GB)</text>

    <!-- Messages -->
    <circle cx="630" cy="328" r="6" fill="#3b82f6"/>
    <text x="644" y="332">Messages Attachments (6.0 GB)</text>

    <!-- Drive -->
    <circle cx="890" cy="328" r="6" fill="#10b981"/>
    <text x="904" y="332">iCloud Drive (4.2 GB)</text>
  </g>

  <!-- 3 Action Column Cards -->
  <!-- Action 1: Photos & Videos -->
  <g>
    <rect x="120" y="365" width="300" height="175" rx="14" fill="#fafafa" stroke="#e4e4e8" stroke-width="1.2"/>
    <rect x="136" y="380" width="32" height="32" rx="8" fill="#fee2e2"/>
    <text x="152" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="900" fill="#e5322d" text-anchor="middle">1</text>
    <text x="180" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#18181b">Clean Photos Safely</text>
    <text x="136" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Empty Recently Deleted album</text>
    <text x="136" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Offload 4K video to Mac or PC</text>
    <text x="136" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Review duplicates &amp; screenshots</text>
    <text x="136" y="515" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#e5322d">Reclaim: 5 GB to 25 GB</text>
  </g>

  <!-- Action 2: Purge Old Backups -->
  <g>
    <rect x="450" y="365" width="300" height="175" rx="14" fill="#fafafa" stroke="#e4e4e8" stroke-width="1.2"/>
    <rect x="466" y="380" width="32" height="32" rx="8" fill="#fee2e2"/>
    <text x="482" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="900" fill="#e5322d" text-anchor="middle">2</text>
    <text x="510" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#18181b">Prune Device Backups</text>
    <text x="466" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Delete obsolete traded-in devices</text>
    <text x="466" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Turn off bulky third-party app caches</text>
    <text x="466" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Back up to Mac/PC Finder for free</text>
    <text x="466" y="515" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#e5322d">Reclaim: 4 GB to 15 GB</text>
  </g>

  <!-- Action 3: Messages & Drive -->
  <g>
    <rect x="780" y="365" width="300" height="175" rx="14" fill="#fafafa" stroke="#e4e4e8" stroke-width="1.2"/>
    <rect x="796" y="380" width="32" height="32" rx="8" fill="#fee2e2"/>
    <text x="812" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="900" fill="#e5322d" text-anchor="middle">3</text>
    <text x="840" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#18181b">Clear Hidden Media</text>
    <text x="796" y="432" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Delete large iMessage attachments</text>
    <text x="796" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Purge iCloud Drive Downloads folder</text>
    <text x="796" y="476" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="500" fill="#5b5b63">• Empty trash in Mail and Drive</text>
    <text x="796" y="515" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#e5322d">Reclaim: 3 GB to 10 GB</text>
  </g>

  <!-- Footer Branding -->
  <text x="600" y="605" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle">NAVORIKA TECH GUIDES • VERIFIED FOR IOS 18 &amp; MACOS TAHOE 26</text>
</svg>
