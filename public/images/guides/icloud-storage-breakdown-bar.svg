<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="barTitle barDesc">
  <title id="barTitle">iCloud Storage Breakdown Categories</title>
  <desc id="barDesc">Diagram showing how Photos, Backups, Messages, iCloud Drive, and Mail divide typical iCloud storage usage.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="#f8fafc" rx="16"/>
  
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="740" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <text x="50" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="800" fill="#0f172a">Understanding Your iCloud Storage Bar Breakdown</text>
  <text x="50" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#64748b">Representative 50 GB iCloud+ storage profile showing major data buckets</text>

  <!-- Bar Visual -->
  <rect x="50" y="115" width="700" height="32" rx="8" fill="#e2e8f0"/>
  <!-- Photos: 26 GB (52% = 364px) -->
  <rect x="50" y="115" width="364" height="32" rx="8" fill="#e5322d"/>
  <!-- Backups: 11 GB (22% = 154px) -->
  <rect x="414" y="115" width="154" height="32" fill="#f97316"/>
  <!-- Messages: 6.5 GB (13% = 91px) -->
  <rect x="568" y="115" width="91" height="32" fill="#3b82f6"/>
  <!-- Drive: 3.5 GB (7% = 49px) -->
  <rect x="659" y="115" width="49" height="32" fill="#10b981"/>
  <!-- Remaining: 3 GB (6% = 42px) -->

  <!-- Categories Table / Cards -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <!-- Category 1 -->
    <rect x="50" y="170" width="335" height="90" rx="10" fill="#fff1f1" stroke="#fecaca" stroke-width="1"/>
    <circle cx="70" cy="195" r="8" fill="#e5322d"/>
    <text x="86" y="200" font-size="14" font-weight="700" fill="#991b1b">Photos &amp; 4K Videos (52%)</text>
    <text x="70" y="224" font-size="12" font-weight="500" fill="#5b5b63">Includes full-resolution camera originals, Live Photos, burst shots, and Recently Deleted album.</text>
    <text x="70" y="244" font-size="11" font-weight="700" fill="#e5322d">Cleanup priority: #1 (Highest yield)</text>

    <!-- Category 2 -->
    <rect x="415" y="170" width="335" height="90" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <circle cx="435" cy="195" r="8" fill="#f97316"/>
    <text x="451" y="200" font-size="14" font-weight="700" fill="#9a3412">Device Backups (22%)</text>
    <text x="435" y="224" font-size="12" font-weight="500" fill="#5b5b63">Settings, app caches, health data, and home screens. Often retains obsolete old phones.</text>
    <text x="435" y="244" font-size="11" font-weight="700" fill="#c2410c">Cleanup priority: #2 (Fastest instant win)</text>

    <!-- Category 3 -->
    <rect x="50" y="280" width="335" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <circle cx="70" cy="305" r="8" fill="#3b82f6"/>
    <text x="86" y="310" font-size="14" font-weight="700" fill="#1e40af">Messages Attachments (13%)</text>
    <text x="70" y="334" font-size="12" font-weight="500" fill="#5b5b63">Audio notes, group chat videos, and photos received via iMessage over years.</text>
    <text x="70" y="354" font-size="11" font-weight="700" fill="#2563eb">Cleanup priority: #3 (Review attachments)</text>

    <!-- Category 4 -->
    <rect x="415" y="280" width="335" height="90" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="435" cy="305" r="8" fill="#10b981"/>
    <text x="451" y="310" font-size="14" font-weight="700" fill="#065f46">iCloud Drive &amp; Documents (7%)</text>
    <text x="435" y="334" font-size="12" font-weight="500" fill="#5b5b63">Mac Desktop &amp; Documents folders, Safari downloads, third-party app save files.</text>
    <text x="435" y="354" font-size="11" font-weight="700" fill="#059669">Cleanup priority: #4 (Clear downloads)</text>
  </g>
</svg>
