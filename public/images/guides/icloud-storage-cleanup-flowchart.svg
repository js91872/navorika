<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">iCloud Storage Full Troubleshooting Decision Flowchart</title>
  <desc id="flowDesc">Flowchart guiding users through diagnosing and resolving an iCloud storage full alert.</desc>
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#f8fafc" rx="16"/>

  <text x="50" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    iCloud Storage Cleanup &amp; Troubleshooting Decision Tree
  </text>
  <text x="50" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Follow the diagnostic path based on your device symptoms to reclaim space safely
  </text>

  <!-- Step 1: Start Node -->
  <g filter="url(#boxShadow)">
    <rect x="250" y="95" width="300" height="50" rx="12" fill="#e5322d"/>
  </g>
  <text x="400" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">
    iCloud Alert: &quot;Storage Almost Full&quot;
  </text>

  <!-- Connecting Lines from Step 1 -->
  <path d="M300 145v40h-160v25" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M400 145v65" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M500 145v40h160v25" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Branch 1: Photos & Videos -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="210" width="220" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <text x="150" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#e5322d" text-anchor="middle">
    Photos Using Most Space?
  </text>
  <text x="150" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    Check Recently Deleted album
  </text>
  <text x="150" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    and 4K/60fps video clips
  </text>

  <!-- Action 1 -->
  <path d="M150 300v40" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="340" width="220" height="140" rx="10" fill="#fff1f1" stroke="#fecaca" stroke-width="1.2"/>
  <text x="150" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">
    Fix Actions:
  </text>
  <text x="55" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">1. Purge &quot;Recently Deleted&quot;</text>
  <text x="55" y="415" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">2. Export long 4K videos</text>
  <text x="55" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">3. Enable &quot;Optimize Storage&quot;</text>
  <text x="150" y="465" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#e5322d" text-anchor="middle">Yield: 5 GB to 30 GB+</text>

  <!-- Branch 2: Backups -->
  <g filter="url(#boxShadow)">
    <rect x="290" y="210" width="220" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <text x="400" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#f97316" text-anchor="middle">
    Backups Dominating Quota?
  </text>
  <text x="400" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    Check for retired iPhones
  </text>
  <text x="400" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    or bloated video app caches
  </text>

  <!-- Action 2 -->
  <path d="M400 300v40" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="290" y="340" width="220" height="140" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="400" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="800" fill="#9a3412" text-anchor="middle">
    Fix Actions:
  </text>
  <text x="305" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">1. Delete old device backups</text>
  <text x="305" y="415" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">2. Toggle off bulky app data</text>
  <text x="305" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">3. Make free Mac/PC backup</text>
  <text x="400" y="465" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#ea580c" text-anchor="middle">Yield: 4 GB to 15 GB</text>

  <!-- Branch 3: Messages & Files -->
  <g filter="url(#boxShadow)">
    <rect x="540" y="210" width="220" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <text x="650" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">
    Messages / Drive Full?
  </text>
  <text x="650" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    Heavy text attachments,
  </text>
  <text x="650" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    Safari downloads, or Mac sync
  </text>

  <!-- Action 3 -->
  <path d="M650 300v40" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="540" y="340" width="220" height="140" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="650" y="365" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">
    Fix Actions:
  </text>
  <text x="555" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">1. Delete top attachments</text>
  <text x="555" y="415" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">2. Set Keep Messages: 1 Yr</text>
  <text x="555" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" fill="#18181b">3. Clear Drive Downloads</text>
  <text x="650" y="465" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Yield: 3 GB to 12 GB</text>
</svg>
