<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">From soil test to fertilizer amount</title><desc id="desc">Three-step calculation workflow: read the nutrient recommendation from a soil test, check the fertilizer percentage, and calculate the product weight.</desc><rect width="1200" height="630" fill="#eff6ff"/><rect x="56" y="55" width="1088" height="520" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/><text x="100" y="133" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1e3a8a">Fertilizer from a soil test</text><text x="100" y="179" font-family="Arial,sans-serif" font-size="22" fill="#475569">Keep nutrient recommendations and fertilizer labels in the same units.</text><g font-family="Arial,sans-serif"><rect x="105" y="242" width="292" height="218" rx="20" fill="#dbeafe"/><rect x="454" y="242" width="292" height="218" rx="20" fill="#dcfce7"/><rect x="803" y="242" width="292" height="218" rx="20" fill="#fef3c7"/><text x="130" y="294" font-size="26" font-weight="700" fill="#1e40af">1. Soil test</text><text x="130" y="341" font-size="20" fill="#1e3a8a">Nutrient recommendation</text><text x="130" y="390" font-size="40" font-weight="700" fill="#1e3a8a">2 lb N</text><text x="130" y="424" font-size="17" fill="#1e3a8a">per 1,000 sq ft</text><text x="479" y="294" font-size="26" font-weight="700" fill="#166534">2. Product label</text><text x="479" y="341" font-size="20" fill="#14532d">Nitrogen percentage</text><text x="479" y="390" font-size="40" font-weight="700" fill="#14532d">20% N</text><text x="479" y="424" font-size="17" fill="#14532d">20 ÷ 100 = 0.20</text><text x="828" y="294" font-size="26" font-weight="700" fill="#92400e">3. Product amount</text><text x="828" y="341" font-size="20" fill="#92400e">2 ÷ 0.20</text><text x="828" y="390" font-size="40" font-weight="700" fill="#92400e">10 lb</text><text x="828" y="424" font-size="17" fill="#92400e">product per 1,000 sq ft</text><text x="410" y="365" font-size="42" fill="#64748b">→</text><text x="759" y="365" font-size="42" fill="#64748b">→</text></g><text x="102" y="516" font-family="Arial,sans-serif" font-size="18" fill="#475569">Illustrative example only · Follow your actual soil-test advice and product label.</text></svg>