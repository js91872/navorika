<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Show battery percentage on Mac</title>
<desc id="desc">A simple illustration of the macOS Battery Options setting and an 82 percent battery indicator in the menu bar.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e7edff"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8faff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#283865" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="630" rx="32" fill="url(#bg)"/>
<circle cx="1040" cy="95" r="165" fill="#c9d6ff" opacity=".5"/>
<circle cx="110" cy="580" r="200" fill="#d9e8ff" opacity=".55"/>
<text x="76" y="114" fill="#4f46e5" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2">MAC QUICK GUIDE · 2026</text>
<text x="76" y="190" fill="#172554" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">Show battery percentage</text>
<text x="76" y="246" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="26">Find the setting in macOS 27 and Tahoe 26</text>
<g filter="url(#shadow)">
  <rect x="76" y="294" width="560" height="258" rx="22" fill="url(#screen)" stroke="#d5ddf0" stroke-width="2"/>
  <rect x="76" y="294" width="560" height="48" rx="22" fill="#f1f4fb"/>
  <path d="M76 320h560v22H76z" fill="#f1f4fb"/>
  <circle cx="106" cy="318" r="6" fill="#ff6b6b"/><circle cx="128" cy="318" r="6" fill="#ffca58"/><circle cx="150" cy="318" r="6" fill="#52c788"/>
  <text x="356" y="325" text-anchor="middle" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">System Settings</text>
  <rect x="104" y="369" width="505" height="42" rx="10" fill="#eef1ff"/>
  <circle cx="130" cy="390" r="10" fill="#4f46e5"/>
  <path d="M130 381v18m-8-9h16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="154" y="396" fill="#27346b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Menu Bar  ›  Battery</text>
  <text x="112" y="452" fill="#172554" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Battery Options</text>
  <text x="112" y="498" fill="#334155" font-family="Arial,Helvetica,sans-serif" font-size="17">Show Percentage</text>
  <rect x="521" y="477" width="58" height="30" rx="15" fill="#4f46e5"/>
  <circle cx="564" cy="492" r="12" fill="#fff"/>
</g>
<g filter="url(#shadow)">
  <rect x="700" y="294" width="424" height="98" rx="20" fill="#172554"/>
  <text x="741" y="354" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">Menu bar</text>
  <rect x="1002" y="325" width="74" height="37" rx="8" fill="none" stroke="#fff" stroke-width="3"/>
  <rect x="1078" y="335" width="8" height="17" rx="3" fill="#fff"/>
  <rect x="1009" y="332" width="51" height="23" rx="4" fill="#60d394"/>
  <text x="1038" y="350" text-anchor="middle" fill="#10203b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">82%</text>
</g>
<text x="700" y="456" fill="#3730a3" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">System Settings › Menu Bar › Battery</text>
<text x="700" y="486" fill="#3730a3" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">› Battery Options › Show Percentage</text>
<text x="700" y="548" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="15">Illustration only. Menu labels can vary by macOS version.</text>
</svg>
