<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Understanding the three N-P-K numbers</title><desc id="desc">A fertilizer label with 10-10-10 nutrient percentages, highlighting nitrogen, phosphate and potash.</desc><rect width="1200" height="630" fill="#f0fdf4"/><rect x="58" y="55" width="1084" height="520" rx="28" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/><text x="112" y="133" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#14532d">Understanding a fertilizer label</text><text x="112" y="180" font-family="Arial,sans-serif" font-size="22" fill="#475569">The numbers are percentages by weight, not an application rate.</text><rect x="112" y="225" width="976" height="173" rx="22" fill="#166534"/><text x="600" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="103" font-weight="700" fill="#ffffff">10 – 10 – 10</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="132" y="435" width="289" height="86" rx="18" fill="#dcfce7"/><rect x="456" y="435" width="289" height="86" rx="18" fill="#e0f2fe"/><rect x="780" y="435" width="289" height="86" rx="18" fill="#fef3c7"/><text x="277" y="471" font-size="29" font-weight="700" fill="#14532d">N</text><text x="277" y="500" font-size="19" fill="#14532d">Nitrogen · 10%</text><text x="600" y="471" font-size="29" font-weight="700" fill="#075985">P₂O₅</text><text x="600" y="500" font-size="19" fill="#075985">Phosphate · 10%</text><text x="924" y="471" font-size="29" font-weight="700" fill="#92400e">K₂O</text><text x="924" y="500" font-size="19" fill="#92400e">Potash · 10%</text></g></svg>